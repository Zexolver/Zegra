<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zegra Launcher</title>

  <!-- Load shared styles -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Load layout and theme separately for modularity -->
  <link rel="stylesheet" href="./layout/default.css" />
  <link rel="stylesheet" href="./themes/default.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">Zegra</div>
      <nav>
        <ul>
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#library" class="nav-link">Library</a></li>
          <li><a href="#store" class="nav-link">Store</a></li>
          <li><a href="#settings" class="nav-link">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <div class="header">
        <input class="search" type="text" placeholder="Search games..." />
      </div>

      <section id="home" class="page-section">
        <h2>Welcome to Zegra</h2>
        <p>Your universal game launcher and manager.</p>
      </section>

      <section id="library" class="page-section">
        <h2>Your Library</h2>
        <div class="game-grid">
          <div class="game-card">
            <img src="https://via.placeholder.com/180x100" alt="Game" />
            <p>Sample Game 1</p>
          </div>
          <div class="game-card">
            <img src="https://via.placeholder.com/180x100" alt="Game" />
            <p>Sample Game 2</p>
          </div>
        </div>
      </section>

      <section id="store" class="page-section">
        <h2>Game Store</h2>
        <div class="game-grid">
          <div class="game-card">
            <img src="https://via.placeholder.com/180x100" alt="Store Game" />
            <p>Featured Game</p>
          </div>
        </div>
      </section>

      <section id="settings" class="page-section">
        <h2>Settings</h2>
        <p>Customize your Zegra experience here.</p>
      </section>
    </main>
  </div>

  <style>
    /* Basic CSS-only navigation with :target */
    .page-section {
      display: none;
    }

    .page-section:target {
      display: block;
    }

    /* Default section if none is selected */
    body:not(:has(:target)) #home {
      display: block;
    }
  </style>
</body>
</html>
