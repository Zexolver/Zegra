<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zegra</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">Zegra</div>
      <nav>
        <ul>
          <li class="active">Library</li>
          <li>Store</li>
          <li>Mods</li>
          <li>Settings</li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <input type="text" placeholder="Search games..." class="search" />
      </header>
      <section class="game-grid">
        <!-- Game Cards -->
        <div class="game-card">
          <img src="placeholder.jpg" alt="Game" />
          <h3>Game Title</h3>
        </div>
        <div class="game-card">
          <img src="placeholder.jpg" alt="Game" />
          <h3>Another Game</h3>
        </div>
        <!-- Add more as needed -->
      </section>
    </main>
  </div>
  <script type="module" src="main.ts"></script>
</body>
</html>
