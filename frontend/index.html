<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zegra</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">Zegra</div>
      <nav>
        <ul>
          <li class="active">Library</li>
          <li>Store</li>
          <li>Settings</li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <input type="text" placeholder="Search games..." class="search" />
      </header>
      <section class="game-grid">
        <!-- Game Cards -->
        <div class="game-card">
          <img src="placeholder.jpg" alt="Game" />
          <h3>Game Title</h3>
          <button class="button" onclick="openModal('Game Title')">View Details</button>
        </div>
        <div class="game-card">
          <img src="placeholder.jpg" alt="Another Game" />
          <h3>Another Game</h3>
          <button class="button" onclick="openModal('Another Game')">View Details</button>
        </div>
        <!-- Add more as needed -->
      </section>
    </main>
  </div>
  <div id="game-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-game-title"></h2>
      <p>Game details go here...</p>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
