<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zegra Launcher</title>
  <link rel="stylesheet" href="./themes/default.css">
  <link rel="stylesheet" href="./layout/default.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">Zegra</div>
      <nav>
        <ul>
          <li data-page="store" class="active">Store</li>
          <li data-page="library">Library</li>
          <li data-page="settings">Settings</li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <div class="header">
        <input type="text" class="search" placeholder="Search games...">
      </div>

      <!-- Store Page -->
      <section id="store" class="page">
        <h2>Store</h2>
        <div class="game-grid">
          <div class="game-card">
            <img src="https://via.placeholder.com/180x100" alt="Game 1">
            <p>Game 1</p>
          </div>
          <div class="game-card">
            <img src="https://via.placeholder.com/180x100" alt="Game 2">
            <p>Game 2</p>
          </div>
        </div>
      </section>

      <!-- Library Page -->
      <section id="library" class="page hidden">
        <h2>Your Library</h2>
        <p>Here you’ll see the games you've installed.</p>
      </section>

      <!-- Settings Page -->
      <section id="settings" class="page hidden">
        <h2>Settings</h2>
        <p>Adjust launcher preferences, themes, account integrations, etc.</p>
      </section>
    </main>
  </div>

  <script src="./main.js" defer></script>
</body>
</html>
